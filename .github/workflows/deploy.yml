name: Deploy to 3d20.app

# Every push to `main` tests the app and deploys the `production` SST stage
# (ADR 0002). The AWS role trusts only workflows on `main` of this repo, so
# dispatching this from any other branch fails at "Assume the deploy role".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No `environment:` here: a job in an environment gets the OIDC subject
    # `...:environment:<name>`, which the role's `ref:refs/heads/main` trust
    # would reject.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
      - run: npx sst deploy --stage production
      - run: npm run smoke
