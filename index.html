<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dice</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="tray"></canvas>
    <section id="history-panel" aria-labelledby="history-heading">
      <h2 id="history-heading">History</h2>
      <ol id="history"></ol>
    </section>
    <div id="overlay">
      <div id="result" aria-live="polite">
        <div id="total">–</div>
        <div id="breakdown"></div>
      </div>
      <div id="hand-controls">
        <div id="die-buttons" role="group" aria-label="Add a Die to the Hand"></div>
        <div id="notation-row">
          <input
            id="notation"
            type="text"
            placeholder="e.g. 2d20kh1+5"
            aria-label="Dice Notation"
            aria-describedby="notation-error"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          />
          <button id="clear" type="button">Clear</button>
          <button id="roll" type="button" disabled>Roll</button>
        </div>
        <div id="notation-error" role="alert"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
